    description: "Reception desk area"
    
  lobby-center:
    x: 0.0
    y: 0.0
    yaw: 0.0
    description: "Center of main lobby"
  
  elevators:
    elevator_1:
      x: 1.56544
      y: 4.27278
      yaw: -1.5708  # facing elevator doors (south)
      description: "Elevator 1 stage position"
    elevator_2:
      x: 3.98915
      y: 4.16426
      yaw: -1.5708  # facing elevator doors (south)
      description: "Elevator 2 stage position"
    elevator_3:
      x: 1.59735
      y: 0.244065
      yaw: 1.5708  # facing elevator doors (north)
      description: "Elevator 3 stage position"
    elevator_4:
      x: 4.00332
      y: 0.141683  
      yaw: 1.5708  # facing elevator doors (north)
      description: "Elevator 4 stage position"

